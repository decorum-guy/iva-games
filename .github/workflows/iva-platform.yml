name: Iva Games platform

on:
  pull_request:
  push:
    branches: [main, feat/iva-platform-foundation]

permissions:
  contents: read

concurrency:
  group: iva-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The territorial game exercises the real paced bots, including trade response windows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: python3 -B -m unittest discover -s deploy/iva-games -p 'test_*.py'
      - run: npx vite build --config games/district/vite.territorial-simulation.config.ts
      - run: node .qa/territorial-runner/simulate.mjs --bot-audit --map=azure-bay --samples=6
      - run: npm run build:all
      - name: Check real realtime admission, controller transfer and recovery
        run: node apps/realtime-server/scripts/network-smoke.mjs
      - run: npm run platform:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run chess-home:e2e -- --workers=1
      - run: npm run portal:e2e -- --workers=1
      - run: node scripts/profile-avatar-browser.mjs
      - run: npm run district:browser
      - run: node scripts/district-interface-browser.mjs
      - run: node scripts/district-trade-browser.mjs
      - run: node scripts/district-audio-browser.mjs
      - run: node scripts/district-territorial-browser.mjs
      # QA output stays in the job logs. No upload-artifact or video/trace storage.

  overdrive-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check the short tutorial and saved/online game isolation
        run: >-
          npx playwright test --config games/chess/overdrive/playwright.config.ts tutorial.spec.ts
          --project desktop-chromium --project mobile-chromium --project landscape-chromium

  forpost-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether Forpost or its shared runtime inputs changed
        id: changes
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
          required = True
          if isinstance(base, str) and re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40:
              if subprocess.run(['git', 'cat-file', '-e', base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
              files = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode().split('\0')
              prefixes = ('games/forpost/', 'apps/realtime-server/', 'apps/platform/', 'apps/portal/',
                          'packages/realtime-kit/', 'packages/session-kit/', 'packages/game-registry/', 'scripts/forpost-')
              exact = {'package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.platform.json',
                       'vite.platform.config.ts', '.github/workflows/iva-platform.yml'}
              required = any(path.startswith(prefixes) or path in exact for path in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('required=' + str(required).lower() + '\n')
          PY
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.required == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.changes.outputs.required == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.required == 'true'
      - name: Exercise the actual Forpost client, platform and realtime processes
        if: steps.changes.outputs.required == 'true'
        run: npm run forpost:e2e
      # Automated UI checks are distinct from the executor's own browser play.
      # No screenshot, video or trace upload is added to the release pipeline.
