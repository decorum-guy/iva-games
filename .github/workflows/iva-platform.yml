name: Iva Games platform

on:
  pull_request:
  push:
    branches: [main, feat/iva-platform-foundation]

permissions:
  contents: read

concurrency:
  group: iva-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: python3 -B deploy/iva-games/test_activation.py
      - run: npm run build:all
      - run: npm run platform:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run portal:e2e -- --workers=1
      # QA output stays in the job logs. No upload-artifact or video/trace storage.
